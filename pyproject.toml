[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-ingest"
description = "Pull capture data off the ASIAIR, file it into the Astronomy archive, and keep the ASIAIR clean."
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "smbprotocol>=1.13,<2.0",
    # previews and frame-quality scoring, as in astro-stacker (app/imaging.py, app/framestats.py)
    "numpy>=1.26,<3.0",
    "astropy>=6.1,<9.0",
    "photutils>=1.13,<4.0",
    "pillow>=10.0,<12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright==1.63.0"]  # playwright: keep in step with dev/Dockerfile

[project.scripts]
astro-ingest = "astro_ingest.cli:main"

[tool.setuptools.dynamic]
version = { attr = "astro_ingest.config.VERSION" }

[tool.setuptools.packages.find]
include = ["astro_ingest*"]

[tool.setuptools.package-data]
astro_ingest = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
